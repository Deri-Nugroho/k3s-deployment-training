---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-toko
  namespace: toko-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-toko
  template:
    metadata:
      labels:
        app: app-toko
    spec:
      containers:
      - name: php-app
        image: app-toko:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: app-config
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: app-toko
  namespace: toko-lab
spec:
  selector:
    app: app-toko
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
